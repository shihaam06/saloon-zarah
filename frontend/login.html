<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kangro — Sign In</title>
<meta name="description" content="Sign in to your Kangro business dashboard to manage appointments, orders, billing, and Instagram automation.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"DM Sans",system-ui,sans-serif}
body{
  background:#09090B;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 20px;
  color:white;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:#3157E8;
  border-radius:50%;
  filter:blur(140px);
  top:-180px;
  left:-180px;
  opacity:.25;
}

body::after{
  content:"";
  position:absolute;
  width:450px;
  height:450px;
  background:#5146E5;
  border-radius:50%;
  filter:blur(140px);
  bottom:-180px;
  right:-180px;
  opacity:.25;
}

.card{
  width:440px;
  max-width:100%;
  background:rgba(23,26,33,.88);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:42px 36px;
  box-shadow:0 25px 60px rgba(0,0,0,.45);
  position:relative;
  z-index:10;
}

.logo{
  width:64px;
  height:64px;
  margin:0 auto 18px;
  border-radius:18px;
  background:linear-gradient(135deg,#3157E8,#5146E5);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 10px 30px rgba(49,87,232,.35);
}
.logo svg{width:32px;height:32px}

h1{
  text-align:center;
  font-size:26px;
  font-family:Manrope,sans-serif;
  font-weight:800;
  letter-spacing:-.03em;
}

.subtitle{
  text-align:center;
  color:#94A3B8;
  margin-top:6px;
  margin-bottom:28px;
  font-size:14px;
}

.input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  background:#11151F;
  border:1px solid #2B3240;
  color:white;
  font-size:14px;
  margin-bottom:16px;
  transition:.2s;
  outline:none;
}

.input:focus{
  border-color:#3157E8;
  box-shadow:0 0 0 3px rgba(49,87,232,.25);
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  font-size:13px;
  color:#94A3B8;
}

.row a{
  color:#5B8CFF;
  text-decoration:none;
}
.row a:hover{text-decoration:underline}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#3157E8,#5146E5);
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(49,87,232,.35);
}

.bottom{
  margin-top:24px;
  text-align:center;
  color:#94A3B8;
  font-size:13px;
}

.bottom a{
  text-decoration:none;
  color:#5B8CFF;
  font-weight:600;
}
.bottom a:hover{text-decoration:underline}

.wa-help{
  margin-top:20px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:12px;
  color:#94A3B8;
}
.wa-help a{
  color:#25D366;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:4px;
  text-decoration:none;
}

.footer-tags{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.tag{
  padding:6px 12px;
  border-radius:999px;
  background:#11151F;
  border:1px solid #2B3240;
  font-size:11px;
  color:#94A3B8;
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">
    <a href="index.html" title="Kangro Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 8l8 4 8-4-8-5Z"/><path d="m4 13 8 5 8-5"/></svg>
    </a>
  </div>

  <h1>Welcome Back</h1>
  <div class="subtitle">Sign in to your Kangro Business Dashboard</div>

  <input type="email" id="email" class="input" placeholder="Email Address" required autocomplete="email">
  <input type="password" id="password" class="input" placeholder="Password" required autocomplete="current-password">

  <div class="row">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox"> Remember me
    </label>
    <a href="forgot-password.html">Forgot Password?</a>
  </div>

  <button id="loginBtn">Sign In →</button>

  <div class="bottom">
    Don't have an account? <a href="register.html">Start Free 14-Day Trial</a>
  </div>

  <!-- WhatsApp Support CTA -->
  <!-- TODO: Replace 91XXXXXXXXXX with your actual WhatsApp business number -->
  <div class="wa-help">
    Need quick assistance?
    <a href="https://wa.me/91XXXXXXXXXX?text=Hi%20Kangro%2C%20I%20need%20help%20logging%20in" target="_blank" rel="noopener">
      💬 Chat on WhatsApp
    </a>
  </div>

  <div class="footer-tags">
    <div class="tag">✂️ SAL for Salons</div>
    <div class="tag">📦 POUCH for Sellers</div>
    <div class="tag">🇮🇳 Made in India</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
