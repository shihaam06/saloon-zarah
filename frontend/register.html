<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kangro | Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#09090B;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{

width:420px;

background:#111827;

padding:40px;

border-radius:24px;

border:1px solid rgba(255,255,255,.06);

box-shadow:
0 20px 50px rgba(0,0,0,.45);

}

.logo{

display:flex;

align-items:center;

justify-content:center;

margin-bottom:30px;

}

.logoBox{

width:70px;

height:70px;

border-radius:20px;

background:linear-gradient(135deg,#7C5CFC,#5B8CFF);

display:flex;

align-items:center;

justify-content:center;

font-size:34px;

box-shadow:0 12px 30px rgba(124,92,252,.35);

}

h1{

text-align:center;

margin-top:18px;

font-size:30px;

font-weight:800;

letter-spacing:-1px;

}

.subtitle{

text-align:center;

margin-top:8px;

color:#94A3B8;

margin-bottom:35px;

}

label{

display:block;

margin-bottom:8px;

font-size:14px;

color:#CBD5E1;

font-weight:500;

}

input{

width:100%;

padding:15px 16px;

border-radius:14px;

border:1px solid #1F2937;

background:#1F2937;

color:white;

font-size:15px;

margin-bottom:20px;

outline:none;

transition:.2s;

}

input:focus{

border-color:#7C5CFC;

box-shadow:0 0 0 4px rgba(124,92,252,.18);

}

button{

width:100%;

padding:15px;

border:none;

border-radius:14px;

background:#7C5CFC;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.25s;

margin-top:10px;

}

button:hover{

background:#6D4DF5;

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(124,92,252,.35);

}

.footer{

margin-top:25px;

text-align:center;

color:#94A3B8;

font-size:14px;

}

.footer a{

color:#7C5CFC;

text-decoration:none;

font-weight:600;

}

.footer a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<div class="logoBox">
📅
</div>

</div>

<h1>Kangro</h1>

<p class="subtitle">
Create your AI Booking Platform account
</p>

<label>Business Name</label>

<input
type="text"
id="businessName"
placeholder="Bella Salon">

<label>Email</label>

<input
type="email"
id="email"
placeholder="owner@example.com">

<label>Account Password</label>

<input
type="password"
id="password"
placeholder="••••••••">

<label>Owner Password / PIN (for Analytics & Settings)</label>

<input
type="password"
id="ownerPin"
placeholder="Used to lock Analytics & Settings">

<button id="registerBtn">
Create Account
</button>

<div class="footer">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
