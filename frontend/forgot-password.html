<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kangro | Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#0F1117;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;color:white;}
body::before{content:"";position:absolute;width:500px;height:500px;background:#6D5DF6;border-radius:50%;filter:blur(140px);top:-180px;left:-180px;opacity:.35;}
body::after{content:"";position:absolute;width:450px;height:450px;background:#8B5CF6;border-radius:50%;filter:blur(140px);bottom:-180px;right:-180px;opacity:.35;}
.card{width:430px;background:rgba(23,26,33,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:45px;box-shadow:0 25px 60px rgba(0,0,0,.45);position:relative;z-index:10;}
.logo{width:75px;height:75px;margin:auto;border-radius:20px;background:linear-gradient(135deg,#6D5DF6,#8B5CF6);display:flex;justify-content:center;align-items:center;font-size:34px;margin-bottom:20px;box-shadow:0 10px 35px rgba(109,93,246,.45);}
h1{text-align:center;font-size:28px;}
.subtitle{text-align:center;color:#9CA3AF;margin-top:8px;margin-bottom:35px;font-size:15px;line-height:1.5;}
.input{width:100%;padding:16px 18px;border-radius:14px;background:#11151F;border:1px solid #2B3240;color:white;font-size:15px;margin-bottom:18px;transition:.3s;}
.input:focus{outline:none;border-color:#6D5DF6;box-shadow:0 0 0 4px rgba(109,93,246,.18);}
button{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;color:white;background:linear-gradient(135deg,#6D5DF6,#8B5CF6);transition:.3s;}
button:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(109,93,246,.35);}
button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
.back{margin-top:22px;text-align:center;color:#9CA3AF;font-size:14px;}
.back a{color:#8B5CF6;text-decoration:none;font-weight:600;}
.success-box{display:none;background:rgba(91,191,138,.12);border:1px solid rgba(91,191,138,.35);border-radius:14px;padding:20px;text-align:center;margin-bottom:20px;}
.success-box .icon{font-size:36px;margin-bottom:10px;}
.success-box p{color:#5bbf8a;font-size:14px;line-height:1.6;}
.error-msg{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#f87171;font-size:14px;margin-bottom:16px;text-align:center;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔑</div>
  <h1>Forgot Password</h1>
  <div class="subtitle">Enter your account email and we'll send you a link to reset your password.</div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="success-box" id="successBox">
    <div class="icon">📬</div>
    <p>If an account exists with this email, we've sent you a password reset link.<br><br>Check your inbox (and spam folder).</p>
  </div>

  <div id="formSection">
    <input type="email" id="resetEmail" class="input" placeholder="Email Address" autocomplete="email">
    <button id="sendBtn">Send Reset Link</button>
  </div>

  <div class="back"><a href="login.html">← Back to Login</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
document.getElementById('sendBtn').addEventListener('click', async () => {
  const email = document.getElementById('resetEmail').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('sendBtn');

  errorMsg.style.display = 'none';

  if (!email) {
    errorMsg.textContent = 'Please enter your email address.';
    errorMsg.style.display = 'block';
    return;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(email)) {
    errorMsg.textContent = 'Please enter a valid email address.';
    errorMsg.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  const redirectTo = window.location.origin + window.location.pathname.replace('forgot-password.html', '') + 'reset-password.html';

  const { error } = await window.client.auth.resetPasswordForEmail(email, {
    redirectTo: redirectTo
  });

  btn.disabled = false;
  btn.textContent = 'Send Reset Link';

  // Always show success to avoid revealing whether email is registered
  document.getElementById('formSection').style.display = 'none';
  document.getElementById('successBox').style.display = 'block';
});

document.getElementById('resetEmail').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('sendBtn').click();
});
</script>
</body>
</html>
